analysis:
  enable_export: false
  enable_statistics: true
  export_format: json
  yara:
    enabled: true
    rules_path: config/yara_rules.yar
    alert_on_detection: true
    min_severity: LOW
capture:
  filter_bpf: null
  interface: null
  output_directory: captures
  rotation:
    enabled: true
    max_duration: 300
    max_packets: 10000
ingestion:
  auto_ingest: true
  database_path: pcap_database.db
  log_directory: logs
  watch_directory: captures
service:
  auto_start: false
  continuous_capture: false
  interval: 60
